# PostSider SaaS — nginx reverse proxy config for VPS
# Place this in /etc/nginx/sites-available/postsider.conf
# symlink to /etc/nginx/sites-enabled/postsider.conf
#
# SSL via Let's Encrypt: certbot --nginx -d app.postsider.com -d db.postsider.com

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=postsider_api:10m rate=30r/s;

# ─── app.postsider.com — Main Application ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.postsider.com;

    # SSL (managed by certbot — paths will be auto-filled)
    ssl_certificate /etc/letsencrypt/live/app.postsider.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.postsider.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 500M;

    # MinIO storage — public read access to uploaded media
    location /storage/ {
        proxy_pass http://127.0.0.1:9000/postsider-media/;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;

        # Security: prevent browser from executing uploaded content
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'none'; script-src 'none'; frame-ancestors 'none'; sandbox" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Disposition "inline" always;

        # Only allow known media content types — strip everything else
        proxy_hide_header Content-Type;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            image/webp webp;
            image/avif avif;
            image/bmp bmp;
            image/tiff tif tiff;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
        }
        default_type application/octet-stream;

        # Cache media aggressively
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # PostSider app (frontend + backend via internal nginx)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass through custom headers used by PostSider auth
        proxy_set_header Reload $http_reload;
        proxy_set_header Onboarding $http_onboarding;
        proxy_set_header Activate $http_activate;
        proxy_set_header Auth $http_auth;
        proxy_set_header Showorg $http_showorg;
        proxy_set_header Impersonate $http_impersonate;

        # Timeouts for long operations
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Rate limiting for API
        limit_req zone=postsider_api burst=50 nodelay;
    }
}

# ─── db.postsider.com — DbGate (Database UI) ───────────────────────────────
server {
    listen 443 ssl http2;
    server_name db.postsider.com;

    ssl_certificate /etc/letsencrypt/live/db.postsider.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/db.postsider.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SECURITY: Restrict access to specific IP addresses only.
    # Replace with your actual admin IPs. Block everyone else.
    # allow 1.2.3.4;        # Your home/office IP
    # allow 5.6.7.8/32;     # VPN exit IP
    # deny all;
    #
    # ⚠️  IMPORTANT: Uncomment the allow/deny lines above before deploying!
    # DbGate exposes full database access — it MUST NOT be publicly reachable.
    # Alternative: remove the db.postsider.com server block entirely and access
    # DbGate only via SSH tunnel: ssh -L 8082:127.0.0.1:8082 your-vps

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /;
    }
}

# ─── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name app.postsider.com db.postsider.com;
    return 301 https://$host$request_uri;
}
