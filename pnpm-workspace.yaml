packages:
  - apps/*
  - libraries/*

overrides:
  react: 19.0.0
  react-dom: 19.0.0
  # Security: force patched versions within the current major (CVE fixes).
  # Upper-bounded (<nextMajor) to avoid unintended major upgrades. See SECURITY.md.
  undici: ">=7.28.0 <8"
  form-data: ">=4.0.6 <5"
  piscina: ">=4.9.3 <5"
  ws: ">=8.21.0 <9"
  multer: ">=2.2.0 <3"
  nodemailer: ">=9.0.1 <10"
  protobufjs: ">=7.5.6 <8"
  tar: ">=7.5.11 <8"
  cross-spawn: ">=7.0.6 <8"
  postcss: ">=8.5.3 <9"

onlyBuiltDependencies:
  - bcrypt
