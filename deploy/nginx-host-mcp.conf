# ─────────────────────────────────────────────────────────────────────────────
# PostSider remote MCP — Host reverse proxy (nginx + certbot)
# ─────────────────────────────────────────────────────────────────────────────
# Fronts the `postsider-mcp` container (published as 127.0.0.1:8081).
#
# Setup on the VPS host:
#   sudo cp deploy/nginx-host-mcp.conf /etc/nginx/sites-available/postsider-mcp
#   sudo ln -s /etc/nginx/sites-available/postsider-mcp /etc/nginx/sites-enabled/
#   # edit the domain below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp.example.com    # provisions TLS + 80→443 redirect
#
# The MCP endpoint is called by machines, not browsers: there is no CORS here
# on purpose, and the container rejects a foreign Origin on its own.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    # MCP payloads are JSON-RPC; 1 MB covers any tool call this server accepts.
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The transport answers JSON by default but a client may negotiate a
    # text/event-stream response; buffering off keeps streamed frames flowing
    # and the long read timeout leaves room for slow tool calls.
    proxy_buffering off;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8081;
    }
}

# After `certbot --nginx` runs, add inside the generated 443 server block:
#   add_header Strict-Transport-Security "max-age=15552000" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   server_tokens off;
