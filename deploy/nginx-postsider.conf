# PostSider — host nginx: app/api/storage.postsider.com → kontenery na localhost
# certbot --nginx doda bloki 443 + redirecty po podpięciu DNS.

# ── Dashboard (frontend) ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.postsider.com;

    client_max_body_size 2G;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}

# ── Backend API ──────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.postsider.com;

    client_max_body_size 2G;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # /foo → kontenerowy nginx /api/foo → backend :3000/foo
    location / {
        proxy_pass http://127.0.0.1:5000/api/;
    }
}

# ── Media (MinIO, bucket postsider-media) ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name storage.postsider.com;

    client_max_body_size 2G;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        rewrite ^/(.*)$ /postsider-media/$1 break;
        proxy_pass http://127.0.0.1:9000;
    }
}
