# ─────────────────────────────────────────────────────────────────────────────
# PostSider — Host reverse proxy (nginx + certbot)  ·  alternative to Caddy
# ─────────────────────────────────────────────────────────────────────────────
# Setup on the VPS host:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/postsider
#   sudo ln -s /etc/nginx/sites-available/postsider /etc/nginx/sites-enabled/
#   # edit the domain below, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.postsider.com      # provisions TLS + 80→443 redirect
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name app.postsider.com;

    # certbot will manage the TLS server block + redirect after you run it.
    # For the initial run it needs port 80 reachable.

    client_max_body_size 2G;

    # WebSocket / keep-alive support.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    # Public media → MinIO bucket "postsider-media"
    # MINIO_PUBLIC_URL=https://app.postsider.com/storage
    location /storage/ {
        rewrite ^/storage/(.*)$ /postsider-media/$1 break;
        proxy_pass http://127.0.0.1:9000;
    }

    # Everything else → app container internal nginx (frontend + /api)
    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}

# After `certbot --nginx` runs, it injects the listen 443 ssl block and adds an
# HTTP→HTTPS redirect. Then add these security headers inside the 443 server:
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header X-Frame-Options "SAMEORIGIN" always;
#   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
