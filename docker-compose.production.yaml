# PostSider SaaS — Production Docker Compose
# Target: VPS with 6GB free RAM, 50GB free disk
# Domain: app.postsider.com (behind nginx reverse proxy on host)
#
# Total estimated RAM usage: ~3.5-4GB
# - PostgreSQL:    ~256MB (shared_buffers)
# - Redis:         ~128MB (maxmemory)
# - MinIO:         ~256MB
# - Temporal:      ~512MB
# - Temporal PG:   ~128MB
# - Elasticsearch: ~512MB (heap)
# - PostSider App: ~1024MB (Node.js backend + frontend)
# - DbGate:       ~128MB

services:
  # ─── PostSider Application ────────────────────────────────────────────────
  postsider:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* must be available at build time (baked into the JS bundle).
        # deploy.sh exports these from .env.production before `docker compose build`.
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:?NEXT_PUBLIC_BACKEND_URL must be set in .env.production}
        NEXT_PUBLIC_SELF_HOSTED: ${NEXT_PUBLIC_SELF_HOSTED:-true}
        NEXT_PUBLIC_VERSION: ${NEXT_PUBLIC_VERSION:-1.0.0}
        NEXT_PUBLIC_TELEGRAM_BOT_NAME: ${NEXT_PUBLIC_TELEGRAM_BOT_NAME:-}
        NEXT_PUBLIC_DISABLE_REGISTRATION: ${NEXT_PUBLIC_DISABLE_REGISTRATION:-}
    container_name: postsider-app
    restart: always
    env_file: .env.production
    environment:
      # Infra invariants: nginx (inside the image) listens on 5000 and proxies to
      # the backend on 3000 and the frontend on 4200, so the backend PORT MUST be
      # 3000. Force it (and prod mode) regardless of what .env.production contains.
      PORT: "3000"
      NODE_ENV: "production"
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 1024M
    volumes:
      - postsider-config:/config/
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - postsider-network
      - temporal-network
    # pm2 gives the orchestrator 35s to drain in-flight Temporal activities on
    # shutdown (ecosystem.config.js kill_timeout); the compose default grace of
    # 10s was SIGKILLing the whole container before that drain could finish.
    stop_grace_period: 45s
    # All three processes, not just the frontend: the old `/` probe proved only
    # that Next.js was up — the backend and the orchestrator's Temporal workers
    # could both be dead while the container reported healthy (that is how a
    # 10-day publishing outage stayed invisible). /health/workers 503s until
    # the workers actually poll, hence the longer start_period (the orchestrator
    # may legitimately wait for Temporal on a cold boot).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/ && wget -q --spider http://localhost:5000/api/health && wget -q --spider http://localhost:3002/health/workers"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      postsider-postgres:
        condition: service_healthy
      postsider-redis:
        condition: service_healthy
      postsider-minio:
        condition: service_healthy
      # Without this the orchestrator's Temporal workers raced the server on a
      # cold boot: the connection was refused, the factory swallowed it, and the
      # app came up "healthy" with ZERO workers polling. Publishing was silently
      # dead for ~10 days in 2026-07.
      temporal:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # ─── PostgreSQL (App Database) ────────────────────────────────────────────
  postsider-postgres:
    image: postgres:17-alpine
    container_name: postsider-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (remove the hardcoded fallback)}
      POSTGRES_USER: ${POSTGRES_USER:-postsider}
      POSTGRES_DB: ${POSTGRES_DB:-postsider_prod}
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=100"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - postsider-network
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-postsider} -d ${POSTGRES_DB:-postsider_prod}
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  postsider-redis:
    image: redis:7-alpine
    container_name: postsider-redis
    restart: always
    # volatile-lru, NOT allkeys-lru: every key we write today has a TTL (OAuth
    # connect state, throttler counters, analytics caches), so behavior is
    # unchanged in practice — but if anything TTL-less is ever stored here
    # (a lock, a queue, a session) allkeys-lru would silently evict it under
    # pressure, while volatile-lru raises a loud OOM error instead. Losing
    # `organization:<state>` mid-OAuth can fork a reconnect into a duplicate
    # channel, so silent eviction is exactly what we do not want.
    command: redis-server --maxmemory 128mb --maxmemory-policy volatile-lru --save 60 1000
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    volumes:
      - redis-data:/data
    networks:
      - postsider-network
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3

  # ─── MinIO (S3-compatible Object Storage) ─────────────────────────────────
  postsider-minio:
    # Pinned to the digest that runs in prod (RELEASE.2025-09-07). `:latest`
    # would jump on the next pull — typically mid-recovery, the worst moment —
    # and MinIO upstream has been stripping features from community builds.
    # To upgrade: change the digest DELIBERATELY and test the S3 surface.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: postsider-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-postsider-minio-key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-postsider-minio-secret-change-me}
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"   # API (proxied via nginx for public access)
      - "127.0.0.1:9001:9001"   # Console UI (optional, can remove in prod)
    networks:
      - postsider-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # MinIO bucket initialization (runs once, then exits)
  # `&&` chaining + no forced `exit 0`: a failed bucket create/policy set must
  # exit non-zero, so the app's depends_on (below) actually gates on a REAL
  # bucket instead of booting into 500s on first upload (fresh installs /
  # disaster-recovery rebuilds).
  minio-init:
    # Pinned for the same reason as postsider-minio above.
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: postsider-minio-init
    depends_on:
      postsider-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://postsider-minio:9000 ${MINIO_ACCESS_KEY:-postsider-minio-key} ${MINIO_SECRET_KEY:-postsider-minio-secret-change-me} &&
      mc mb myminio/${MINIO_BUCKET:-postsider-media} --ignore-existing &&
      mc anonymous set-json /policy.json myminio/${MINIO_BUCKET:-postsider-media} &&
      echo 'MinIO bucket ready (public GET only, no anonymous listing)'
      "
    volumes:
      # Anonymous policy = s3:GetObject ONLY. `mc anonymous set download` (the
      # previous line) also grants s3:ListBucket to *, which let anyone enumerate
      # and download EVERY org's media via GET /?list-type=2. GetObject-only keeps
      # media publicly fetchable by exact URL (platforms need this) without the
      # bucket-wide listing. Resource ARN matches MINIO_BUCKET's default.
      - ./minio-anon-policy.json:/policy.json:ro
    networks:
      - postsider-network

  # ─── DbGate (Database UI) ───────────────────────────────────────────────
  postsider-dbgate:
    # Pinned — a DB UI with stored prod credentials should never self-upgrade.
    image: dbgate/dbgate@sha256:331726a5387fe38f0ed37b97092b12d891308e5995f36d8e4db3028fe0744140
    container_name: postsider-dbgate
    restart: always
    environment:
      CONNECTIONS: con1
      LABEL_con1: PostSider Production
      SERVER_con1: postsider-postgres
      USER_con1: ${POSTGRES_USER:-postsider}
      PASSWORD_con1: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (remove the hardcoded fallback)}
      PORT_con1: 5432
      ENGINE_con1: postgres@dbgate-plugin-postgres
      DATABASE_con1: ${POSTGRES_DB:-postsider_prod}
      WEB_LOGIN: "true"
      LOGIN_PASSWORD: ${DBGATE_PASSWORD:-change-me-dbgate}
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    ports:
      - "127.0.0.1:8082:3000"
    networks:
      - postsider-network
    depends_on:
      postsider-postgres:
        condition: service_healthy

  # ─── Temporal Stack ───────────────────────────────────────────────────────
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: postsider-temporal-es
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx384m
      - xpack.security.enabled=false
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - temporal-network
    expose:
      - 9200
    volumes:
      - temporal-es-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    image: postgres:16-alpine
    container_name: postsider-temporal-pg
    restart: always
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    networks:
      - temporal-network
    expose:
      - 5432
    volumes:
      - temporal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U temporal
      interval: 10s
      timeout: 3s
      retries: 3

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: postsider-temporal
    restart: always
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_started
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postsider-temporal-pg
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=postsider-temporal-es
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - temporal-network
    expose:
      - 7233
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    # Readiness for the orchestrator's workers is NOT "the server accepts TCP" —
    # auto-setup registers the `default` namespace only after the server is up,
    # and a worker connecting before that fails. Describing the namespace covers
    # both. Address must be the container IP: the server does not bind ::1, so
    # `localhost:7233` is refused even when it is fully healthy.
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe -n ${TEMPORAL_NAMESPACE:-default} --address $$(hostname -i):7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: postsider-temporal-ui
    restart: always
    environment:
      - TEMPORAL_ADDRESS=postsider-temporal:7233
      - TEMPORAL_CORS_ORIGINS=https://app.postsider.com
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    networks:
      - temporal-network
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
  redis-data:
  minio-data:
  postsider-config:
  temporal-es-data:
  temporal-pg-data:

networks:
  postsider-network:
    driver: bridge
  temporal-network:
    driver: bridge
    name: postsider-temporal-network
