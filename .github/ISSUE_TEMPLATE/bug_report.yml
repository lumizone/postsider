name: Bug report
description: Report reproducible behavior that differs from the documented or expected result.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, OAuth tokens, customer data, server addresses or logs containing secrets.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Go to ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PostSider version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Docker version and browser where relevant. Do not include secrets.
    validations:
      required: true
