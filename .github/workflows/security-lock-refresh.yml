name: One-shot lockfile refresh for Stage 4 security patch

on:
  push:
    branches:
      - feat/security-dependency-refresh-2026-11
    paths:
      - .github/workflows/security-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: >-
      github.event.head_commit.message == 'ci(security): regenerate lockfile for patched dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.1
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Resolve security dependencies without executing package scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit only updated lockfile to this working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --staged --quiet; then
            echo 'Lockfile unchanged.'
          else
            git commit -m 'chore(security): regenerate pnpm lockfile for fixed dependency floors [skip ci]'
            git push origin HEAD:refs/heads/feat/security-dependency-refresh-2026-11
          fi
