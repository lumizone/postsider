name: Publish image

# Builds the runtime image and pushes it to GHCR as
# ghcr.io/lumizone/postsider-app. docker-compose.yaml pulls `:latest` from here,
# so the README quick start works without building anything locally.
#
# NOTE: Next.js inlines NEXT_PUBLIC_* into the client bundle at BUILD time, so a
# published image is bound to the URL it was built with. This image is built for
# the default quick-start setup (http://localhost:4007). Self-hosters on a real
# domain must build their own image, which is what docker-compose.production.yaml
# already does.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (e.g. v1.1.0). Always also pushes :latest.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lumizone/postsider-app
  QUICKSTART_BACKEND_URL: http://localhost:4007/api

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=PostSider
            org.opencontainers.image.description=Open-source social media scheduling for 30+ platforms
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.url=https://postsider.com

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ env.QUICKSTART_BACKEND_URL }}
            NEXT_PUBLIC_SELF_HOSTED=true
            NEXT_PUBLIC_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull with: \`docker pull ${{ env.IMAGE }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
